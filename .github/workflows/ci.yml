name: CI

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "scripts/**"
      - "Package.swift"
      - "project.yml"
      - "Config/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "scripts/**"
      - "Package.swift"
      - "project.yml"
      - "Config/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify public source hygiene
        run: scripts/tests/public-source-tests.sh

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        env:
          CLANG_MODULE_CACHE_PATH: /private/tmp/LetItBrewCI-ClangCache
          SWIFTPM_MODULECACHE_OVERRIDE: /private/tmp/LetItBrewCI-SwiftPMCache
        run: swift test --no-parallel

      - name: Run optimized Codex rollout tests
        env:
          CLANG_MODULE_CACHE_PATH: /private/tmp/LetItBrewCI-ReleaseClangCache
          SWIFTPM_MODULECACHE_OVERRIDE: /private/tmp/LetItBrewCI-ReleaseSwiftPMCache
        run: swift test -c release --filter CodexActiveSessionObserverTests

      - name: Test installed-app release scripts with isolated fixtures
        run: scripts/tests/upgrade-transaction-tests.sh

      - name: Test detached one-click update runner with isolated fixtures
        run: scripts/tests/update-runner-tests.sh

      - name: Test direct-distribution scripts with isolated fixtures
        run: scripts/tests/direct-distribution-tests.sh
