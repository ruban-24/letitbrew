name: Bug report
description: Report a reproducible Let It Brew problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private project contents, credentials, or unrelated Claude/Codex configuration. Use [private vulnerability reporting](https://github.com/ruban-24/letitbrew/security/advisories/new) for security issues.

  - type: input
    id: version
    attributes:
      label: Let It Brew version and build
      description: Settings → About.
      placeholder: "0.4.0 (15)"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.3, MacBook Pro M3"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Do not force a power value or system setting just to reproduce.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Affected surface
      options:
        - Claude Code CLI
        - Claude Desktop Code
        - Codex CLI
        - Codex app
        - Cursor desktop Agent
        - Cursor CLI
        - OpenCode stable 1.x
        - GitHub Copilot CLI
        - Let It Brew only
        - Not sure
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Power and safety observations
      description: |
        Whether holds, `SleepDisabled`, app/service count, or your own configuration changed. Read the current value with `pmset -g | grep SleepDisabled` — do not force a value just to collect this report.
